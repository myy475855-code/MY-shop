{% extends "base.html" %}
{% block title %}Change password — {{ store_name }}{% endblock %}
{% block content %}
<section class="section container">
  <div class="section-head"><h2>{{ icon('shield', 20) }}Change password</h2></div>

  <form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="current_password">Current password</label>
      <input type="password" id="current_password" name="current_password" required autofocus>
    </div>
    <div class="field">
      <label for="new_password">New password</label>
      <input type="password" id="new_password" name="new_password" required minlength="6">
      <div class="field-hint">At least 6 characters.</div>
    </div>
    <div class="field">
      <label for="confirm_password">Confirm new password</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary">{{ icon('check-circle', 16) }}Update password</button>
    <a href="{{ url_for('main.account') }}" class="btn btn-ghost">Cancel</a>
  </form>
</section>
{% endblock %}
