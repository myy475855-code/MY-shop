{% extends "layout.html" %}
{% block body %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>

<div class="vh-100 d-flex align-items-center justify-content-center ecommerce-bg">
  <div class="ecommerce-card animate__animated animate__fadeInUp animate__delay-0.5s">
    <div class="ecommerce-header">
      <div class="logo-placeholder">
        <i class="bi bi-shield-check"></i>
      </div>
      <h3 class="ecommerce-title">Verify Your Email</h3>
      <p class="ecommerce-sub">Enter the 6-digit code sent to your email address</p>
    </div>

    <form method="POST" id="verify-form">
      <div class="d-flex justify-content-between mb-4 code-row">
        {% for i in range(6) %}
        <input type="text" name="code{{ i }}" maxlength="1" class="code-box" required>
        {% endfor %}
      </div>

      <button type="submit" class="ecommerce-btn">Verify Code</button>
    </form>

    <div class="ecommerce-links">
      <a href="{{ url_for('forgot_password') }}">Didn't receive the code? Resend</a>
    </div>
  </div>
</div>

<style>
/* E-commerce Background with Subtle Product Imagery */
.ecommerce-bg {
  background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
  position: relative;
  overflow: hidden;
}

.ecommerce-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(circle at 25% 25%, rgba(102, 126, 234, 0.05) 0%, transparent 50%),
    radial-gradient(circle at 75% 75%, rgba(118, 75, 162, 0.05) 0%, transparent 50%),
    url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><pattern id="productPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="2" fill="%23667eea" opacity="0.1"/><rect x="10" y="10" width="20" height="20" fill="none" stroke="%23e9ecef" stroke-width="0.5" opacity="0.2"/></pattern></defs><rect width="200" height="200" fill="url(%23productPattern)"/></svg>');
  opacity: 0.6;
  animation: subtleFloat 20s ease-in-out infinite;
}

@keyframes subtleFloat {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(1deg); }
}

/* Card with Subtle Shadow and Clean Design */
.ecommerce-card {
  width: 450px;
  max-width: 90vw;
  padding: 50px 40px;
  border-radius: 16px;
  background: white;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
  text-align: center;
  position: relative;
  transition: all 0.3s ease;
}

.ecommerce-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
}

/* Header with Logo Placeholder */
.ecommerce-header {
  margin-bottom: 30px;
}

.logo-placeholder {
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  color: white;
  font-size: 1.5rem;
}

.ecommerce-title {
  color: #333;
  font-weight: 700;
  margin-bottom: 10px;
  font-size: 1.8rem;
}

.ecommerce-sub {
  color: #666;
  margin-bottom: 0;
  font-size: 0.95rem;
}

/* Code inputs */
.code-row {
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
}

.code-box {
  width: 50px;
  height: 50px;
  font-size: 1.2rem;
  text-align: center;
  border-radius: 8px;
  background: #f8f9fa;
  border: 1px solid #e9ecef;
  color: #333;
  outline: none;
  transition: all 0.3s ease;
}

.code-box:focus {
  border-color: #667eea;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  background: white;
}

/* Button with Gradient */
.ecommerce-btn {
  margin-top: 10px;
  width: 100%;
  padding: 16px;
  border-radius: 8px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none;
  color: white;
  font-weight: 600;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.ecommerce-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent);
  transform: translateX(-100%);
  transition: transform 0.5s;
}

.ecommerce-btn:hover::before {
  transform: translateX(100%);
}

.ecommerce-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}

/* Links */
.ecommerce-links a {
  display: block;
  margin-top: 15px;
  color: #667eea;
  text-decoration: none;
  font-weight: 500;
  transition: 0.3s;
}

.ecommerce-links a:hover {
  color: #764ba2;
}

/* Responsive */
@media (max-width: 768px) {
  .ecommerce-card {
    width: 95vw;
    padding: 40px 30px;
  }

  .code-box {
    width: 40px;
    height: 40px;
    font-size: 1.1rem;
  }

  .ecommerce-title {
    font-size: 1.5rem;
  }
}

@media (max-width: 576px) {
  .code-box {
    width: 35px;
    height: 35px;
    font-size: 1rem;
  }

  .code-row {
    gap: 0.3rem;
  }
}
</style>

<script>
const inputs = document.querySelectorAll('.code-box');
inputs.forEach((input, idx) => {
  input.addEventListener('input', () => {
    if(input.value.length === 1 && idx < inputs.length - 1){
      inputs[idx+1].focus();
    }
  });
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Backspace' && !input.value && idx > 0){
      inputs[idx-1].focus();
    }
  });
});

// Combine inputs into hidden field before submit
document.getElementById('verify-form').addEventListener('submit', function(e){
  const codeValue = Array.from(inputs).map(i => i.value).join('');
  const hiddenInput = document.createElement('input');
  hiddenInput.type = 'hidden';
  hiddenInput.name = 'code';
  hiddenInput.value = codeValue;
  this.appendChild(hiddenInput);
});
</script>

{% endblock %}
