{% extends "base.html" %}
{% block title %}Add your delivery address — {{ store_name }}{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="form-card wide">
    <h2>{{ icon('map-pin', 22) }}One more step</h2>
    <p>Add a delivery address so we know where to send your orders. You can add more or change this later from your account.</p>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" value="{{ full_name or '' }}" required autofocus>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="phone">Phone</label>
          <input type="text" id="phone" name="phone" value="{{ phone or '' }}" required>
        </div>
        <div class="field">
          <label for="city">City</label>
          <input type="text" id="city" name="city" value="{{ city or '' }}" required>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="province">Province / State</label>
          <select id="province" name="province" required>
            <option value="" disabled {% if not province %}selected{% endif %}>Select province</option>
            {% for p in provinces %}
              <option value="{{ p }}" {% if province == p %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="country">Country</label>
          <select id="country" name="country" required>
            {% for c in countries %}
              <option value="{{ c }}" {% if (country and country == c) or (not country and c == 'Pakistan') %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="field">
        <label for="address_line">Address</label>
        <textarea id="address_line" name="address_line" rows="3" required>{{ address_line or '' }}</textarea>
      </div>
      <button type="submit" class="btn btn-gold btn-block">{{ icon('check-circle', 16) }}Save address and continue</button>
    </form>
  </div>
</div>
{% endblock %}
