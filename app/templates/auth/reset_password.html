{% extends "base.html" %}
{% block title %}Reset password — {{ store_name }}{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="form-card">
    <h2>{{ icon('shield', 20) }}Choose a new password</h2>
    <p>Make it something you haven't used before.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required minlength="6" autofocus>
        <div class="field-hint">At least 6 characters.</div>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block">{{ icon('check-circle', 16) }}Update password</button>
    </form>
  </div>
</div>
{% endblock %}
