{% extends "base.html" %}
{% block title %}Sign in — {{ store_name }}{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="form-card">
    <h2>Welcome back</h2>
    <p>Sign in to check out, track orders, and manage your wishlist.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="field-check">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember" style="margin:0;">Keep me signed in</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <div class="auth-switch">New to {{ store_name }}? <a href="{{ url_for('auth.register') }}">Create an account</a></div>
  </div>
</div>
{% endblock %}
